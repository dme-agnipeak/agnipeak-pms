function initSB(){try{if(SUPABASE_URL&&SUPABASE_KEY&&window.supabase)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){sb=null}}
async function dbAll(tbl,order){if(sb){var r=await sb.from(tbl).select("*").order(order||"id",{ascending:false});return r.data||[]}return [...(mem[tbl]||[])].reverse()}
async function dbInsert(tbl,row){if(sb){var r=await sb.from(tbl).insert(row).select();if(r.error)throw new Error(tbl+": "+r.error.message);return r.data&&r.data[0]}row.id=(mem[tbl].length?mem[tbl][mem[tbl].length-1].id:0)+1;mem[tbl].push(row);return row}
async function dbInsertMany(tbl,rows){if(sb){var r=await sb.from(tbl).insert(rows).select();if(r.error)throw new Error(tbl+": "+r.error.message);return r.data||[]}rows.forEach(function(row){row.id=(mem[tbl].length?mem[tbl][mem[tbl].length-1].id:0)+1;mem[tbl].push(row)});return rows}
async function dbUpdate(tbl,id,patch){if(sb){var r=await sb.from(tbl).update(patch).eq("id",id);if(r.error)throw new Error(tbl+": "+r.error.message);return}var x=(mem[tbl]||[]).find(function(y){return y.id===id});if(x)Object.assign(x,patch)}
async function dbDelete(tbl,id){if(sb){await sb.from(tbl).delete().eq("id",id);return}mem[tbl]=(mem[tbl]||[]).filter(function(x){return x.id!==id})}
async function dbDeleteBy(tbl,col,val){if(sb){var r=await sb.from(tbl).delete().eq(col,val);if(r.error)throw new Error(tbl+": "+r.error.message);return}mem[tbl]=(mem[tbl]||[]).filter(function(x){return x[col]!==val})}

async function createBatch(d){

 var bb=await dbInsert("batches",b);var bid=bb.id;
 var rows=STEPS.map(function(s,i){return {batch_id:bid,step_no:i+1,step_name:s[0],in_qty:i===0?d.final_qty:0,done_qty:0,good_qty:0,scrap_qty:0,rework_qty:0,added_item:"",operator:i===0?d.operator:"",status:i===0?"running":"pending",remark:"",photo:"",started_at:i===0?nowISO():null,completed_at:null}});
 await dbInsertMany("batch_steps",rows);return bid;
}
/* ---- PARTIAL STEP ENTRY ENGINE ----
   Har step par jitni qty ka kaam hua utni hi update hoti hai (Process Qty).
   remaining = in_qty - done_qty wahin pending rehta hai.
   Step 5: manual qty -> Step 6 In; machine good -> Step 7 In. Step 6 good -> Step 7 In (merge). */
async function addStepEntry(bid,stepNo,v){
 var steps=await stepsOf(bid);var cur=steps.find(function(s){return s.step_no===stepNo});if(!cur)return;
 var bats=await dbAll("batches");var bat=bats.find(function(b){return b.id===bid})||{};
 var qty=+v.qty||0;var rem=(+cur.in_qty||0)-(+cur.done_qty||0);
 if(qty<=0||qty>rem)throw new Error("Qty 1.."+rem);
 var scrap=Math.max(0,+v.scrap||0),rework=Math.max(0,+v.rework||0);
 var good=qty-scrap-rework;if(good<0)throw new Error("Scrap+Rework > Qty");
 var sold=0;if(v.sale==="full")sold=good;else if(v.sale==="partial")sold=Math.min(good,+v.sale_qty||0);
 var fwd=good-sold;
 // 1) entry log
 var ent=await dbInsert("step_entries",{batch_id:bid,batch_no:bat.batch_no||"",product:bat.product||"",color:bat.color||"",step_no:stepNo,qty:qty,good_qty:good,scrap_qty:scrap,rework_qty:rework,sale_type:sold>0?v.sale:"",sale_qty:sold,added_item:v.added||"",remark:v.remark||"",operator:v.operator||"",photo:v.photo||"",created_by:v.created_by||(user?user.name:""),created_at:v.created_at||nowISO()});
 var entId=(ent&&ent.id)||null;
 // 2) scrap lot
 if(scrap>0){await dbInsert("scrap_lots",{batch_id:bid,batch_no:bat.batch_no||"",product:bat.product||"",color:bat.color||"",from_step:stepNo,qty:scrap,scrap_step:1,status:"in_progress",remark:"",operator:v.operator||"",step_entry_id:entId,created_at:nowISO(),completed_at:null})}
 // 3) sale
 if(sold>0){await dbInsert("sales",{batch_id:bid,batch_no:bat.batch_no||"",product:bat.product||"",color:bat.color||"",step_no:stepNo,qty:sold,sale_type:v.sale,operator:v.operator||"",step_entry_id:entId,created_at:nowISO()})}
 // 4) current step cumulative totals
 await dbUpdate("batch_steps",cur.id,{done_qty:(+cur.done_qty||0)+qty,good_qty:(+cur.good_qty||0)+good,scrap_qty:(+cur.scrap_qty||0)+scrap,rework_qty:(+cur.rework_qty||0)+rework,added_item:v.added||cur.added_item,remark:v.remark||cur.remark,operator:v.operator||cur.operator,photo:v.photo||cur.photo||"",started_at:cur.started_at||nowISO()});
 // 5) forward
 async function addIn(stepN,q){if(q<=0)return;var sx=steps.find(function(s){return s.step_no===stepN});if(!sx)return;await dbUpdate("batch_steps",sx.id,{in_qty:(+sx.in_qty||0)+q,started_at:sx.started_at||nowISO()})}
 if(stepNo===5){await addIn(6,rework);await addIn(7,fwd)}
 else if(stepNo===6){await addIn(7,fwd)}
 else if(stepNo<NSTEPS){await addIn(stepNo+1,fwd)}
 // 6) recompute statuses + batch
 await recomputeBatch(bid);
}
async function recomputeBatch(bid){
 var steps=await stepsOf(bid);var allPrevDone=true;var firstRem=0;var s10=steps.find(function(s){return s.step_no===NSTEPS})||{};
 for(var i=0;i<steps.length;i++){var s=steps[i];var rem=(+s.in_qty||0)-(+s.done_qty||0);
  var st;
  if(rem>0)st="running";
  else if(allPrevDone)st="completed";
  else st=(+s.in_qty||0)>0?"running":"pending";
  if(rem>0&&!firstRem)firstRem=s.step_no;
  if(st!==s.status){var patch={status:st};if(st==="completed"&&!s.completed_at)patch.completed_at=nowISO();await dbUpdate("batch_steps",s.id,patch)}
  if(rem>0)allPrevDone=false;
 }
 var anyRem=steps.some(function(s){return ((+s.in_qty||0)-(+s.done_qty||0))>0});
 var status,curStep;
 if(anyRem){status="in_progress";curStep=firstRem}
 else{status=(+s10.good_qty||0)>0?"completed":"sold";curStep=NSTEPS}
 await dbUpdate("batches",bid,{status:status,current_step:curStep});
}

/* ===================== v3: ENTRY EDIT / DELETE ENGINE ===================== */
/* Har entry ne current step ke totals badhaye the + aage ke step me in_qty forward ki thi.
   Delete/Edit par woh sab safely REVERSE hota hai — downstream check ke saath. */
function entryFwd(e){
 /* Returns [[stepNo, qty]] — jo qty is entry ne aage forward ki thi */
 var good=+e.good_qty||0,sold=+e.sale_qty||0,rw=+e.rework_qty||0,fwd=Math.max(0,good-sold),out=[];
 if(e.step_no===5){if(rw>0)out.push([6,rw]);if(fwd>0)out.push([7,fwd])}
 else if(e.step_no===6){if(fwd>0)out.push([7,fwd])}
 else if(e.step_no<NSTEPS){if(fwd>0)out.push([e.step_no+1,fwd])}
 return out;
}
async function reverseStepEntry(e){
 var steps=await stepsOf(e.batch_id);
 var cur=steps.find(function(s){return s.step_no===e.step_no});
 if(!cur)throw new Error("Step not found");
 var fwd=entryFwd(e);
 /* SAFETY: agar aage ke step ne forwarded qty already process kar li hai to block */
 for(var i=0;i<fwd.length;i++){
  var sx=steps.find(function(s){return s.step_no===fwd[i][0]});
  if(sx&&((+sx.in_qty||0)-fwd[i][1])<(+sx.done_qty||0))throw new Error(t("downstream_err"));
 }
 /* reverse current step cumulative totals */
 await dbUpdate("batch_steps",cur.id,{
  done_qty:Math.max(0,(+cur.done_qty||0)-(+e.qty||0)),
  good_qty:Math.max(0,(+cur.good_qty||0)-(+e.good_qty||0)),
  scrap_qty:Math.max(0,(+cur.scrap_qty||0)-(+e.scrap_qty||0)),
  rework_qty:Math.max(0,(+cur.rework_qty||0)-(+e.rework_qty||0))
 });
 /* reverse forwarded in_qty on downstream steps */
 for(var j=0;j<fwd.length;j++){
  var sy=steps.find(function(s){return s.step_no===fwd[j][0]});
  if(sy)await dbUpdate("batch_steps",sy.id,{in_qty:Math.max(0,(+sy.in_qty||0)-fwd[j][1])});
 }
 /* delete linked scrap lot(s) & sale(s) of this entry */
 if(e.id!=null){
  try{await dbDeleteBy("scrap_lots","step_entry_id",e.id)}catch(x1){}
  try{await dbDeleteBy("sales","step_entry_id",e.id)}catch(x2){}
 }
}

 if(!confirm(t("confirm_del_entry")))return;
 try{

  await recomputeBatch(e.batch_id);
  toast(t("entry_deleted"),"success");closeModal();render();
 }catch(err){toast("Error: "+err.message,"error")}
}

function saleChange(){

 if(v==="full"){info.style.display="block";info.textContent=t("sold")+": "+good+" · "+(lang==="hi"?"लॉट यहीं खत्म":"lot ends here")}
 else if(v==="partial"){var sq=Math.min(good,+$("m_saleq").value||0);info.style.display="block";info.textContent=t("sold")+": "+sq+" · "+(lang==="hi"?"अगले स्टेप पर":"to next step")+": "+(good-sq)}

function readPhoto(){return new Promise(function(res){var inp=$("m_photo");var f=inp&&inp.files&&inp.files[0];if(!f){res("");return}var fr=new FileReader();fr.onload=function(){var img=new Image();img.onload=function(){try{var mx=Math.max(img.width,img.height);var sc=Math.min(1,520/mx);var c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.6))}catch(e){res("")}};img.onerror=function(){res("")};img.src=fr.result};fr.onerror=function(){res("")};fr.readAsDataURL(f)})}

function userModal(id){
 var u=id?UCACHE.find(function(x){return x.id===id}):null;
 var sel=u?parseSteps(u.allowed_steps):[];
 var chk=STEPS.map(function(s,i){return '<label class="chk"><input type="checkbox" class="ustep" value="'+(i+1)+'"'+(sel.indexOf(i+1)!==-1?' checked':'')+'> '+(i+1)+'. '+esc(s[lang==="hi"?1:0])+'</label>'}).join("");
 $("modal").innerHTML='<div class="mo"><div class="modal"><div class="modal-h"><h5><i class="fas fa-user-'+(u?'pen':'plus')+'"></i> '+(u?t("edit"):t("add_user"))+'</h5><button class="tbtn" onclick="closeModal()"><i class="fas fa-times"></i></button></div>'+
  '<div class="modal-b">'+
   '<div class="fg"><label class="fl">'+t("name")+' *</label><input id="u_name" class="fi" value="'+esc(u?u.name:"")+'"></div>'+
   '<div class="fg"><label class="fl">'+t("email")+' *</label><input id="u_email" class="fi" value="'+esc(u?u.email:"")+'"></div>'+
   '<div class="fg"><label class="fl">'+t("pass")+' *</label><input id="u_pass" class="fi" value="'+esc(u?u.password:"welcome123")+'"></div>'+
   '<div class="fg"><label class="fl">'+t("role")+'</label><select id="u_role" class="fi">'+ROLES.map(function(r){return '<option'+(u&&u.role===r?' selected':'')+'>'+r+'</option>'}).join("")+'</select></div>'+
   '<div class="fg"><label class="fl">'+t("phone")+'</label><input id="u_phone" class="fi" value="'+esc(u?u.phone||"":"")+'"></div>'+
   '<div class="fg"><label class="fl">'+t("status")+'</label><select id="u_active" class="fi"><option value="1"'+((!u||u.active)?' selected':'')+'>'+t("active")+'</option><option value="0"'+((u&&!u.active)?' selected':'')+'>Off</option></select></div>'+
   '<div class="fg"><label class="fl"><i class="fas fa-user-pen" style="color:var(--accent)"></i> '+t("perm_edit")+'</label><select id="u_canedit" class="fi"><option value="0"'+((!u||!u.can_edit_entries)?' selected':'')+'>Off</option><option value="1"'+((u&&u.can_edit_entries)?' selected':'')+'>'+t("active")+' (ON)</option></select></div>'+
   '<div class="fg"><label class="fl">'+t("allowed_steps")+'</label><div class="chk-grid">'+chk+'</div></div>'+
  '</div>'+
  '<div class="modal-f"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveUser('+(u?u.id:0)+')"><i class="fas fa-save"></i> '+t("save")+'</button></div>'+
 '</div></div>';
}
async function saveUser(id){
 var steps=[];document.querySelectorAll(".ustep:checked").forEach(function(c){steps.push(c.value)});
 var r={name:$("u_name").value.trim(),email:$("u_email").value.trim(),password:$("u_pass").value,role:$("u_role").value,phone:$("u_phone").value.trim(),allowed_steps:steps.join(","),can_edit_entries:$("u_canedit").value==="1",active:$("u_active").value==="1"};
 if(!r.name||!r.email){toast("Name & email required","warning");return}
 try{
  if(id){await dbUpdate("app_users",id,r);if(user&&user.id===id){user=Object.assign({},user,r);saveSession()}toast(t("saved"),"success")}
  else{await dbInsert("app_users",r);toast("User added","success")}
  closeModal();render()
 }catch(e){toast("Error: "+e.message,"error")}
}

async function doLogin(){
 var e=$("le").value.trim(),p=$("lp").value,b=$("lbtn");
 if(!e||!p){toast(t("badlogin"),"warning");return}
 b.disabled=true;b.innerHTML='<i class="fas fa-spinner fa-spin"></i> …';
 try{var u=await dbLogin(e,p);
  if(u){user=u;saveSession();page="dashboard";$("wtext").textContent=(lang==="hi"?"स्वागत है, ":"Welcome, ")+(u.name||"");$("welcome").classList.add("show");setTimeout(function(){render();setTimeout(function(){$("welcome").classList.remove("show")},500)},900)}
  else{b.disabled=false;b.innerHTML='<i class="fas fa-sign-in-alt"></i> '+t("login");toast(t("badlogin"),"error")}
 }catch(err){b.disabled=false;b.innerHTML='<i class="fas fa-sign-in-alt"></i> '+t("login");toast("Connection error","error")}
}
function saveSession(){try{localStorage.setItem("vap_pms_user",JSON.stringify(user))}catch(e){}}
function loadSessionUser(){try{var s=localStorage.getItem("vap_pms_user");return s?JSON.parse(s):null}catch(e){return null}}
function clearSession(){try{localStorage.removeItem("vap_pms_user")}catch(e){}}
function logout(){user=null;clearSession();render()}

function toCSV(rows){if(!rows.length)return"";var h=Object.keys(rows[0]);return [h.join(",")].concat(rows.map(function(r){return h.map(function(k){return '"'+String(r[k]==null?"":r[k]).replace(/"/g,'""')+'"'}).join(",")})).join("\n")}
function dl(name,txt,type){var b=new Blob([txt],{type:type});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function repCSV(){dl("report_"+dstr(new Date())+".csv",toCSV(window._rep||[]),"text/csv");toast("CSV downloaded","success")}
async function repCSVall(){dl("batch_steps_"+dstr(new Date())+".csv",toCSV(await dbAll("batch_steps")),"text/csv");toast("CSV downloaded","success")}
function repExcel(){var rows=window._rep||[];var keys=Object.keys(rows[0]||{step_no:""});var h='<table border="1"><tr>'+keys.map(function(k){return "<th>"+k+"</th>"}).join("")+"</tr>"+rows.map(function(r){return "<tr>"+keys.map(function(k){return "<td>"+(r[k]==null?"":r[k])+"</td>"}).join("")+"</tr>"}).join("")+"</table>";dl("report_"+dstr(new Date())+".xls",h,"application/vnd.ms-excel");toast("Excel downloaded","success")}
function repPrint(){var rows=window._rep||[];var w=open("","","width=1000,height=700");w.document.write('<html><head><title>'+esc(COMPANY.name)+' — Report</title><style>body{font-family:Arial;padding:24px}h2{color:#0f2557}th{background:#0f2557;color:#fff;padding:9px;text-align:left;font-size:11px}td{padding:7px 9px;border-bottom:1px solid #e5e7eb;font-size:11px}table{width:100%;border-collapse:collapse}.f{margin-top:20px;text-align:center;color:#6b7280;font-size:11px;border-top:1px solid #e5e7eb;padding-top:12px}</style></head><body><h2>'+esc(COMPANY.name)+' — Production Report</h2><div style="color:#6b7280;font-size:12px;margin-bottom:16px">'+esc(COMPANY.address||"")+' · '+FILTER.from+' to '+FILTER.to+' · '+new Date().toLocaleString()+'</div><table><thead><tr><th>Date</th><th>Batch</th><th>Color</th><th>Step</th><th>Operator</th><th>Qty</th><th>Good</th><th>Scrap</th><th>Sold</th></tr></thead><tbody>'+rows.map(function(s){return '<tr><td>'+(s.created_at||"").slice(0,10)+'</td><td>'+(s.batch_no||"")+'</td><td>'+(s.color||"")+'</td><td>Step '+s.step_no+'</td><td>'+(s.operator||"")+'</td><td>'+s.qty+'</td><td>'+s.good_qty+'</td><td>'+s.scrap_qty+'</td><td>'+(s.sale_qty||0)+'</td></tr>'}).join("")+'</tbody></table><div class="f">Developed By Sunil Tiwari · 9027965956 · connect@systemmaster.in · systemmaster.in</div></body></html>');w.document.close();setTimeout(function(){w.print()},500)}
async function dlJSON(){var all={app_users:await dbAll("app_users"),batches:await dbAll("batches"),batch_steps:await dbAll("batch_steps"),step_entries:await dbAll("step_entries"),sales:await dbAll("sales"),scrap_lots:await dbAll("scrap_lots"),products:await dbAll("products"),colors:await dbAll("colors"),company:[COMPANY]};dl("mes_backup_"+dstr(new Date())+".json",JSON.stringify(all,null,2),"application/json");toast("JSON downloaded","success")}
async function backupSheets(){
 if(!GSHEET_URL){toast(t("gsheet_off"),"warning");return}
 var stepsAll=(await dbAll("batch_steps")).map(function(s){var x=Object.assign({},s);x.photo=x.photo?"YES":"";return x});
 var entAll=(await dbAll("step_entries")).map(function(s){var x=Object.assign({},s);x.photo=x.photo?"YES":"";return x});
 var tables={Users:await dbAll("app_users"),Batches:await dbAll("batches"),BatchSteps:stepsAll,StepEntries:entAll,Sales:await dbAll("sales"),ScrapLots:await dbAll("scrap_lots"),Products:await dbAll("products"),Colors:await dbAll("colors")};
 try{await fetch(GSHEET_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({tables:tables})});toast(t("gsheet_done"),"success")}catch(e){toast("Error: "+e.message,"error")}
}
