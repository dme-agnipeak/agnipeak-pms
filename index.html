.sk{background:linear-gradient(90deg,var(--g100),var(--g200),var(--g100));background-size:200% 100%;animation:sk 1.1s infinite;border-radius:12px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;background:var(--g100);border:1px solid var(--line);font-size:.82em;font-weight:600;color:var(--text)}
.chip:active{transform:scale(.96)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.switch{position:relative;width:46px;height:26px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--g300);border-radius:20px;transition:.2s}
.switch span::before{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--success)}.switch input:checked+span::before{transform:translateX(20px)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.set-row:last-child{border-bottom:none}
.note{font-size:.8em;color:var(--muted);line-height:1.5}

.hero{background:linear-gradient(135deg,var(--primary-dark),var(--primary) 60%,#1e40af);color:#fff;border-radius:var(--radius-lg);padding:20px;margin-bottom:18px;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.25),transparent 70%)}
.hero .hi{font-size:.85em;opacity:.8}.hero .nm{font-family:'Sora';font-size:1.35em;font-weight:800;margin:2px 0 8px}
.hero .line{font-size:.9em;opacity:.92;line-height:1.5}
.hero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative;z-index:1}

.ring{position:relative;width:118px;height:118px;flex-shrink:0}

.ring .rv b{font-family:'Sora';font-size:1.45em;display:block;line-height:1}.ring .rv small{font-size:.66em;opacity:.8;text-transform:uppercase;letter-spacing:.5px}

.insights{display:flex;flex-direction:column;gap:9px}
.ins{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--g50);border:1px solid var(--line);font-size:.88em;line-height:1.45}
.ins i{margin-top:2px;width:18px;text-align:center}
.ins.good i{color:var(--success)}.ins.bad i{color:var(--danger)}.ins.warn i{color:var(--accent)}.ins.info i{color:var(--info)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.bdgc{border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;background:var(--g50)}
.bdgc .e{font-size:1.8em;line-height:1}.bdgc .n{font-size:.76em;font-weight:700;margin-top:6px}.bdgc .d{font-size:.68em;color:var(--muted);margin-top:2px}

.lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.lb:last-child{border:none}

.lb .r.g1{background:#fde68a;color:#92400e}.lb .r.g2{background:#e5e7eb;color:#374151}.lb .r.g3{background:#fed7aa;color:#9a3412}

/* task cards */
.tgroup{margin-bottom:18px}.tgroup h6{font-family:'Sora';font-size:.9em;color:var(--muted);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}

.tcard .meta{font-size:.82em;color:var(--muted)}
.tcard.old{border-left-color:var(--danger)}
/* stock */
.bigstock{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:18px}
.bs-main{background:linear-gradient(135deg,#065f46,#10b981);color:#fff;border-radius:var(--radius-lg);padding:20px}

@keyframes ring{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}100%{box-shadow:0 0 0 16px rgba(239,68,68,0)}}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g400);margin:0 2px;animation:bl 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}

#voice{position:fixed;inset:0;background:rgba(10,24,56,.92);z-index:5000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;padding:24px;text-align:center}

#voice .vh{font-size:.85em;opacity:.75;max-width:520px;line-height:1.6}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:9998}
.celebrate{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--surface);border-radius:20px;padding:22px 28px;box-shadow:0 20px 60px rgba(0,0,0,.3);z-index:9997;text-align:center;animation:bin .5s cubic-bezier(.16,1,.3,1);max-width:90vw}

}

async function fetchTable(tbl){
 var cols=COLS[tbl]||"*",out=[],from=0,PAGE=1000,guard=0;
 while(guard++<200){
  var r=await sb.from(tbl).select(cols).order("id",{ascending:false}).range(from,from+PAGE-1);
  if(r.error){
   if(cols!=="*"&&tbl!=="app_users"){console.warn("[pms] lean select failed, fallback *",tbl,r.error.message);cols="*";out=[];from=0;continue}
   throw new Error(tbl+": "+r.error.message);
  }
  var d=r.data||[];if(cols==="*")d=d.map(stripHeavy);
  out=out.concat(d);if(d.length<PAGE)break;from+=PAGE;
 }
 return out;
}
function setOnline(v){if(ONLINE===v)return;ONLINE=v;var d=document.querySelectorAll(".net-dot");d.forEach(function(x){x.classList.toggle("off",!v)});var ob=$("offbar");if(ob)ob.style.display=v?"none":"block"}
function revalidate(tbl,bg){
 var v=VER[tbl]||0;
 if(INFLIGHT[tbl]&&INFLIGHT[tbl].v===v)return INFLIGHT[tbl].p;
 var p=fetchTable(tbl).then(function(rows){
  setOnline(true);
  if((VER[tbl]||0)===v){
   var old=CACHE[tbl];var changed=!old||old.rows.length!==rows.length||JSON.stringify(old.rows)!==JSON.stringify(rows);
   CACHE[tbl]={rows:rows,ts:Date.now()};delete DIRTY[tbl];if(changed)persistCache();
   if(bg&&changed)softRefresh();
  }
  return rows;
 }).catch(function(e){
  if(/fetch|network|Failed/i.test(String(e&&e.message)))setOnline(false);
  if(CACHE[tbl])return CACHE[tbl].rows;throw e;
 }).finally(function(){if(INFLIGHT[tbl]&&INFLIGHT[tbl].p===p)delete INFLIGHT[tbl]});
 INFLIGHT[tbl]={v:v,p:p};return p;
}

   Step 5: manual qty -> Step 6 In; machine good -> Step 7 In. Step 6 good -> Step 7 In (merge). */
async function addStepEntry(bid,stepNo,v){
 var res=await Promise.all([stepsOf(bid),batchById(bid)]);var steps=res[0],bat=res[1]||{};
 var cur=steps.find(function(s){return s.step_no===stepNo});if(!cur)throw new Error("Step not found");
 var qty=+v.qty||0;var rem=(+cur.in_qty||0)-(+cur.done_qty||0);
 if(qty<=0||qty>rem)throw new Error("Qty 1.."+rem);
 var scrap=Math.max(0,+v.scrap||0),rework=Math.max(0,+v.rework||0);
 var good=qty-scrap-rework;if(good<0)throw new Error("Scrap+Rework > Qty");
 var sold=0;if(v.sale==="full")sold=good;else if(v.sale==="partial")sold=Math.min(good,+v.sale_qty||0);
 var fwd=good-sold;
 var ent=await dbInsert("step_entries",{batch_id:bid,batch_no:bat.batch_no||"",product:bat.product||"",color:bat.color||"",step_no:stepNo,qty:qty,good_qty:good,scrap_qty:scrap,rework_qty:rework,sale_type:sold>0?v.sale:"",sale_qty:sold,added_item:v.added||"",remark:v.remark||"",operator:v.operator||"",photo:v.photo||"",created_by:v.created_by||(user?user.name:""),created_at:v.created_at||nowISO()});
 var entId=(ent&&ent.id)||null;
 var jobs=[];
 if(scrap>0)jobs.push(dbInsert("scrap_lots",{batch_id:bid,batch_no:bat.batch_no||"",product:bat.product||"",color:bat.color||"",from_step:stepNo,qty:scrap,scrap_step:1,status:"in_progress",remark:"",operator:v.operator||"",step_entry_id:entId,created_at:nowISO(),completed_at:null}));
 if(sold>0)jobs.push(dbInsert("sales",{batch_id:bid,batch_no:bat.batch_no||"",product:bat.product||"",color:bat.color||"",step_no:stepNo,qty:sold,sale_type:v.sale,operator:v.operator||"",step_entry_id:entId,created_at:nowISO()}));
 var curPatch={done_qty:(+cur.done_qty||0)+qty,good_qty:(+cur.good_qty||0)+good,scrap_qty:(+cur.scrap_qty||0)+scrap,rework_qty:(+cur.rework_qty||0)+rework,added_item:v.added||cur.added_item,remark:v.remark||cur.remark,operator:v.operator||cur.operator,started_at:cur.started_at||nowISO()};
 if(v.photo)curPatch.photo=v.photo;
 jobs.push(dbUpdate("batch_steps",cur.id,curPatch));
 function addIn(stepN,q){if(q<=0)return;var sx=steps.find(function(s){return s.step_no===stepN});if(!sx)return;jobs.push(dbUpdate("batch_steps",sx.id,{in_qty:(+sx.in_qty||0)+q,started_at:sx.started_at||nowISO()}))}
 if(stepNo===5){addIn(6,rework);addIn(7,fwd)}
 else if(stepNo===6){addIn(7,fwd)}
 else if(stepNo<NSTEPS){addIn(stepNo+1,fwd)}
 await Promise.all(jobs);
 await recomputeBatch(bid);
 return {qty:qty,good:good,scrap:scrap,sold:sold};
}
async function recomputeBatch(bid){
 var steps=await stepsOf(bid);var allPrevDone=true;var firstRem=0;var s10=steps.find(function(s){return s.step_no===NSTEPS})||{};var jobs=[];
 for(var i=0;i<steps.length;i++){var s=steps[i];var rem=(+s.in_qty||0)-(+s.done_qty||0);
  var st;
  if(rem>0)st="running";
  else if(allPrevDone)st="completed";
  else st=(+s.in_qty||0)>0?"running":"pending";
  if(rem>0&&!firstRem)firstRem=s.step_no;
  if(st!==s.status){var patch={status:st};if(st==="completed"&&!s.completed_at)patch.completed_at=nowISO();jobs.push(dbUpdate("batch_steps",s.id,patch))}
  if(rem>0)allPrevDone=false;
 }
 var anyRem=steps.some(function(s){return ((+s.in_qty||0)-(+s.done_qty||0))>0});
 var status,curStep;
 if(anyRem){status="in_progress";curStep=firstRem}
 else{status=(+s10.good_qty||0)>0?"completed":"sold";curStep=NSTEPS}
 jobs.push(dbUpdate("batches",bid,{status:status,current_step:curStep}));
 await Promise.all(jobs);
}
function entryFwd(e){
 var good=+e.good_qty||0,sold=+e.sale_qty||0,rw=+e.rework_qty||0,fwd=Math.max(0,good-sold),out=[];
 if(e.step_no===5){if(rw>0)out.push([6,rw]);if(fwd>0)out.push([7,fwd])}
 else if(e.step_no===6){if(fwd>0)out.push([7,fwd])}
 else if(e.step_no<NSTEPS){if(fwd>0)out.push([e.step_no+1,fwd])}
 return out;
}
async function reverseStepEntry(e){
 var steps=await stepsOf(e.batch_id);
 var cur=steps.find(function(s){return s.step_no===e.step_no});
 if(!cur)throw new Error("Step not found");
 var fwd=entryFwd(e);
 for(var i=0;i<fwd.length;i++){
  var sx=steps.find(function(s){return s.step_no===fwd[i][0]});
  if(sx&&((+sx.in_qty||0)-fwd[i][1])<(+sx.done_qty||0))throw new Error(t("downstream_err"));
 }
 var jobs=[dbUpdate("batch_steps",cur.id,{
  done_qty:Math.max(0,(+cur.done_qty||0)-(+e.qty||0)),
  good_qty:Math.max(0,(+cur.good_qty||0)-(+e.good_qty||0)),
  scrap_qty:Math.max(0,(+cur.scrap_qty||0)-(+e.scrap_qty||0)),
  rework_qty:Math.max(0,(+cur.rework_qty||0)-(+e.rework_qty||0))})];
 fwd.forEach(function(f){var sy=steps.find(function(s){return s.step_no===f[0]});if(sy)jobs.push(dbUpdate("batch_steps",sy.id,{in_qty:Math.max(0,(+sy.in_qty||0)-f[1])}))});
 if(e.id!=null){jobs.push(dbDeleteBy("scrap_lots","step_entry_id",e.id).catch(function(){}));jobs.push(dbDeleteBy("sales","step_entry_id",e.id).catch(function(){}))}
 await Promise.all(jobs);
}

/* ===================== ANALYTICS (shared by Stock, Home, AI) ===================== */
/* Stock model v4:
   WIP        = pending qty on Steps 2..10 (material physically on the floor)
   Ready      = Step 10 good qty − qty sold AT step 10 (v3 bug: sold pieces were still counted as packed stock)
   ReworkHold = rework qty at steps other than 5 (v3: silently vanished from stock)
   MouldQ     = Step 1 pending (not yet moulded, shown separately)                                  */
function computeStock(batches,steps,sales,slots){
 var byB={};steps.forEach(function(s){(byB[s.batch_id]=byB[s.batch_id]||[]).push(s)});
 var salesB={},sold10B={};sales.forEach(function(s){salesB[s.batch_id]=(salesB[s.batch_id]||0)+(+s.qty||0);if(+s.step_no===NSTEPS)sold10B[s.batch_id]=(sold10B[s.batch_id]||0)+(+s.qty||0)});
 var scT={},scP={};slots.forEach(function(s){scT[s.batch_id]=(scT[s.batch_id]||0)+(+s.qty||0);if(s.status==="in_progress")scP[s.batch_id]=(scP[s.batch_id]||0)+(+s.qty||0)});
 var stepWip={},stepOld={},stepBat={};for(var i=1;i<=NSTEPS;i++){stepWip[i]=0;stepOld[i]=0;stepBat[i]=0}
 var rows=batches.map(function(b){
  var bs=byB[b.id]||[];var wip=0,mould=0,packed=0,rwHold=0,rwAdd=0;
  bs.forEach(function(s){var rem=Math.max(0,(+s.in_qty||0)-(+s.done_qty||0));
   if(s.step_no===1)mould+=rem;else wip+=rem;
   if(rem>0){stepWip[s.step_no]+=rem;stepBat[s.step_no]++;var a=ageDays(s.started_at||b.created_at);if(a>stepOld[s.step_no])stepOld[s.step_no]=a}
   if(s.step_no===NSTEPS)packed+=(+s.good_qty||0);
   if(s.step_no===6)rwAdd+=(+s.good_qty||0);
   if(s.step_no!==5)rwHold+=(+s.rework_qty||0)});
  var ready=Math.max(0,packed-(sold10B[b.id]||0));
  return {b:b,wip:wip,mould:mould,packed:packed,ready:ready,rwHold:rwHold,rwAdd:rwAdd,sold:salesB[b.id]||0,scT:scT[b.id]||0,scP:scP[b.id]||0,total:wip+ready+rwHold};
 });
 var T0={wip:0,mould:0,packed:0,ready:0,rwHold:0,rwAdd:0,sold:0,scT:0,scP:0,total:0};
 rows.forEach(function(r){for(var k in T0)T0[k]+=r[k]});
 var grp={};rows.forEach(function(r){var k=(r.b.product||"—")+"||"+(r.b.color||"—");if(!grp[k])grp[k]={product:r.b.product||"—",color:r.b.color||"—",n:0,wip:0,mould:0,packed:0,ready:0,rwHold:0,rwAdd:0,sold:0,scT:0,scP:0,total:0};
  var g=grp[k];g.n++;for(var kk in T0)g[kk]+=r[kk]});
 var byProd={};rows.forEach(function(r){var p=r.b.product||"—";byProd[p]=(byProd[p]||0)+r.ready});
 return {rows:rows,T:T0,groups:Object.values(grp).sort(function(a,b){return b.total-a.total}),stepWip:stepWip,stepOld:stepOld,stepBat:stepBat,byProd:byProd};
}
function sumBy(list,k){return list.reduce(function(a,x){return a+(+x[k]||0)},0)}
function entriesOn(entries,d){return entries.filter(function(e){return ldate(e.created_at)===d})}
function entriesSince(entries,d){return entries.filter(function(e){return ldate(e.created_at)>=d})}
function outputOf(list){return sumBy(list.filter(function(e){return e.step_no===NSTEPS}),"good_qty")}
function isMine(e){return !!user&&(e.created_by===user.name||(!e.created_by&&e.operator===user.name)||e.operator===user.name)}
function streakOf(entries){
 var days={};entries.filter(isMine).forEach(function(e){days[ldate(e.created_at)]=1});
 var n=0,d=new Date();if(!days[dstr(d)])d=addDays(d,-1);
 while(days[dstr(d)]){n++;d=addDays(d,-1)}
 return {n:n,todayDone:!!days[today()],total:Object.keys(days).length};
}
function leaderboard(entries,since){
 var m={};entriesSince(entries,since).forEach(function(e){var k=e.operator||e.created_by||"—";m[k]=(m[k]||0)+(+e.qty||0)});
 return Object.keys(m).map(function(k){return {name:k,q:m[k]}}).sort(function(a,b){return b.q-a.q});
}
function dailySeries(entries,days){var out=[];for(var i=days-1;i>=0;i--){var d=daysAgo(i);var l=entriesOn(entries,d);out.push({d:d,out:outputOf(l),proc:sumBy(l,"qty"),scrap:sumBy(l,"scrap_qty"),good:sumBy(l,"good_qty")})}return out}

  '<div class="form-row">'+

   '<div><label class="fl">'+t("in_q")+' ('+T("shots","शॉट")+')</label><input id="e_in" type="number" inputmode="numeric" class="fi" value="'+(last.inq||100)+'" oninput="qtyCalc()"></div>'+

   '<div style="grid-column:1/-1"><label class="fl">'+t("operator")+'</label><input id="e_op" class="fi" value="'+esc(user.name)+'"></div>'+
   '<div style="grid-column:1/-1"><label class="fl">'+t("auto_time")+'</label><input class="fi" value="'+new Date().toLocaleString("en-IN")+'" readonly style="background:var(--g100)"></div>'+
  '</div>'+
  '<p class="note" style="margin-top:12px"><i class="fas fa-info-circle"></i> '+T("Starts at Step 1 (Moulding) — Final Qty becomes Step 1 In.","Step 1 (मोल्डिंग) से शुरू होगा — Final Qty ही Step 1 का In होगी।")+'</p>'+
  '<button class="btn btn-accent btn-block" id="sb_btn" style="margin-top:14px;padding:14px" onclick="startBatch()"><i class="fas fa-play"></i> '+t("start_batch")+'</button>'+

function prodChange(){var s=$("e_prod");if(!s)return;var o=s.options[s.selectedIndex];var cav=o&&o.getAttribute("data-cav")?+o.getAttribute("data-cav"):"";$("e_cav").value=cav;qtyCalc()}
function colorChange(){var c=$("e_color");$("e_color_c").style.display=c.value==="__custom__"?"block":"none"}
function qtyCalc(){var cav=+$("e_cav").value||0;var inq=+$("e_in").value||0;$("e_final").value=cav&&inq?(cav*inq).toLocaleString("en-IN"):"—"}
async function startBatch(){
 var g=function(id){return $(id).value};
 var prod=g("e_prod");if(!prod){toast(t("select_product"),"warning");return}
 var color=g("e_color");if(color==="__custom__"){color=g("e_color_c").trim();if(!color){toast(t("custom_color"),"warning");return}
  try{await dbInsert("colors",{name:color})}catch(e){}}
 var cav=+$("e_cav").value||1;var inq=+$("e_in").value||0;var fin=cav*inq;
 if(!g("e_batch")){toast("Batch number required","warning");return}
 if(inq<=0){toast(t("in_q"),"warning");return}
 var b=$("sb_btn");b.disabled=true;b.innerHTML='<i class="fas fa-spinner fa-spin"></i> …';
 try{
  var all=await dbAll("batches");if(all.some(function(x){return x.batch_no===g("e_batch")})){toast(T("Batch No. already exists","यह बैच नंबर पहले से है"),"warning");b.disabled=false;b.innerHTML='<i class="fas fa-play"></i> '+t("start_batch");return}
  var bid=await createBatch({batch_no:g("e_batch"),product:prod,color:color,cavity:cav,input_qty:inq,final_qty:fin,shift:g("e_shift"),machine:g("e_machine"),operator:g("e_op")});
  lsSet("pms_last_batch",{product:prod,color:color,inq:inq,machine:g("e_machine")});
  toast(t("started"),"success");celebrate("🚀",T("Batch started!","बैच शुरू!"),fmt(fin)+" "+t("pcs")+" → Step 1");openBatch(bid)
 }catch(e){b.disabled=false;b.innerHTML='<i class="fas fa-play"></i> '+t("start_batch");toast("Error: "+e.message,"error")}
}

PAGES.scrap=async function(v){
 var lots=await dbAll("scrap_lots");
 var pend=lots.filter(function(s){return s.status==="in_progress"}),done=lots.filter(function(s){return s.status==="done"});
 function rows(list,act){
  if(!list.length)return emptyBox("—");
  return '<div class="tw"><table class="dt"><thead><tr><th>'+t("batch")+'</th><th>'+t("product")+'</th><th>'+t("color")+'</th><th>'+t("from_step")+'</th><th>'+t("qty")+'</th><th>'+t("scrap_step")+'</th><th>'+t("date")+'</th>'+(act?'<th></th>':'')+'</tr></thead><tbody>'+
   list.map(function(s){var sn=SCRAP_STEPS[Math.min(s.scrap_step||1,SCRAP_STEPS.length)-1][lang==="hi"?1:0];
    return '<tr><td><strong>'+esc(s.batch_no)+'</strong></td><td>'+esc(s.product||"")+'</td><td><span class="badge b-info">'+esc(s.color||"")+'</span></td><td>Step '+s.from_step+'</td><td><b>'+fmt(s.qty)+'</b></td><td>'+(s.status==="done"?'<span class="badge b-success">'+t("scrap_done")+'</span>':((s.scrap_step||1)+'/'+SCRAP_STEPS.length+' · '+esc(sn)))+'</td><td>'+ldate(s.created_at)+'</td>'+
    (act?'<td><button class="btn btn-accent btn-sm" onclick="scrapModal('+s.id+','+(s.scrap_step||1)+')"><i class="fas fa-arrow-right"></i> '+t("update_step")+'</button></td>':'')+'</tr>'}).join("")+
  '</tbody></table></div>';
 }
 v.innerHTML='<div class="stat-grid">'+[[t("scrap_pending"),fmt(sumBy(pend,"qty")),t("pcs"),"hourglass-half","orange"],[t("scrap_done"),fmt(sumBy(done,"qty")),t("pcs"),"check-double","green"]].map(statCard).join("")+'</div>'+
  '<div class="panel"><div class="panel-h"><h5><i class="fas fa-recycle"></i> '+t("scrap")+' — '+t("pending_s")+' <span class="badge b-warning">'+pend.length+'</span></h5></div><div class="panel-b">'+rows(pend,true)+'</div></div>'+
  '<div class="panel"><div class="panel-h"><h5><i class="fas fa-check-double"></i> '+t("scrap_done")+' <span class="badge b-success">'+done.length+'</span></h5></div><div class="panel-b">'+rows(done.slice(0,200),false)+'</div></div>';
};
function scrapModal(id,curStep){
 var last=curStep>=SCRAP_STEPS.length;
 $("modal").innerHTML='<div class="mo"><div class="modal"><div class="modal-h"><h5><i class="fas fa-recycle"></i> '+t("scrap_step")+' '+curStep+': '+esc(SCRAP_STEPS[curStep-1][lang==="hi"?1:0])+'</h5><button class="tbtn" onclick="closeModal()"><i class="fas fa-times"></i></button></div>'+
  '<div class="modal-b"><div class="fg"><label class="fl">'+t("operator")+'</label><input id="sc_op" class="fi" value="'+esc(user.name)+'"></div><div class="fg"><label class="fl">'+t("remarks")+'</label><input id="sc_rem" class="fi"></div></div>'+
  '<div class="modal-f"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-accent" onclick="scrapAdvance('+id+','+curStep+')"><i class="fas fa-check"></i> '+(last?t("complete"):t("complete_next"))+'</button></div></div></div>';
}
async function scrapAdvance(id,curStep){
 try{var patch={operator:$("sc_op").value,remark:$("sc_rem").value};
  if(curStep>=SCRAP_STEPS.length){patch.status="done";patch.completed_at=nowISO();patch.scrap_step=SCRAP_STEPS.length}else patch.scrap_step=curStep+1;
  await dbUpdate("scrap_lots",id,patch);toast(t("step_done"),"success");closeModal();render();
 }catch(e){toast("Error: "+e.message,"error")}
}

async function saveUser(id){
 var steps=[];document.querySelectorAll(".ustep:checked").forEach(function(c){steps.push(c.value)});
 var r={name:$("u_name").value.trim(),email:$("u_email").value.trim(),role:$("u_role").value,phone:$("u_phone").value.trim(),allowed_steps:steps.join(","),can_edit_entries:$("u_canedit").value==="1",active:$("u_active").value==="1"};
 var pw=$("u_pass").value;if(pw)r.password=pw;
 if(!r.name||!r.email){toast("Name & email required","warning");return}
 if(!id&&!pw){toast(t("pass"),"warning");return}
 if(pw&&pw.length<6){toast(T("Password: min 6 characters","पासवर्ड: कम से कम 6 अक्षर"),"warning");return}
 try{
  if(id){await dbUpdate("app_users",id,r);if(user&&user.id===id){delete r.password;user=Object.assign({},user,r);saveSession()}toast(t("saved"),"success")}
  else{await dbInsert("app_users",r);toast("User added","success")}
  closeModal();render()
 }catch(e){toast("Error: "+e.message,"error")}
}

function stepScrapTable(list){var m={};list.forEach(function(e){var k=e.step_no;if(!m[k])m[k]={step:k,name:stepName(k),processed:0,scrap:0,rework:0};m[k].processed+=(+e.qty||0);m[k].scrap+=(+e.scrap_qty||0);m[k].rework+=(+e.rework_qty||0)});return Object.values(m).map(function(x){x.scrap_pct=+pct(x.scrap,x.processed).toFixed(2);return x}).sort(function(a,b){return a.step-b.step})}
function computeInsights(d,st){
 var E=d.step_entries,out=[];var tdE=entriesOn(E,today());var prev=E.filter(function(e){var x=ldate(e.created_at);return x>=daysAgo(7)&&x<today()});
 var tdOut=outputOf(tdE),target=getTarget(),tq=sumBy(tdE,"qty"),ts=sumBy(tdE,"scrap_qty"),pq=sumBy(prev,"qty"),ps=sumBy(prev,"scrap_qty");
 if(tdOut>=target&&target)out.push({type:"good",icon:"trophy",text:T("Target achieved today: <b>"+fmt(tdOut)+"</b> / "+fmt(target)+" 🎉","आज का टारगेट पूरा: <b>"+fmt(tdOut)+"</b> / "+fmt(target)+" 🎉")});
 else out.push({type:"warn",icon:"bullseye",text:T("Today's target: <b>"+fmt(tdOut)+"</b> / "+fmt(target)+" packed — <b>"+fmt(target-tdOut)+"</b> more to go.","आज का टारगेट: <b>"+fmt(tdOut)+"</b> / "+fmt(target)+" पैक — अभी <b>"+fmt(target-tdOut)+"</b> और चाहिए।")});
 if(tq>0){var sT=pct(ts,tq),s7=pct(ps,pq);
  if(pq>0&&sT>s7*1.25&&sT>1)out.push({type:"bad",icon:"arrow-trend-up",text:T("Scrap today <b>"+sT.toFixed(1)+"%</b> vs 7-day avg "+s7.toFixed(1)+"% — check machines/material.","आज स्क्रैप <b>"+sT.toFixed(1)+"%</b>, 7 दिन औसत "+s7.toFixed(1)+"% — मशीन/मटेरियल जाँचें।")});
  else out.push({type:"good",icon:"arrow-trend-down",text:T("Scrap today <b>"+sT.toFixed(1)+"%</b>"+(pq?" (7-day avg "+s7.toFixed(1)+"%)":"")+" — under control.","आज स्क्रैप <b>"+sT.toFixed(1)+"%</b>"+(pq?" (7 दिन औसत "+s7.toFixed(1)+"%)":"")+" — नियंत्रण में।")})}
 var ss=stepScrapTable(entriesSince(E,daysAgo(6))).filter(function(x){return x.scrap>0}).sort(function(a,b){return b.scrap_pct-a.scrap_pct})[0];
 if(ss)out.push({type:"info",icon:"magnifying-glass-chart",text:T("Highest scrap (7 days): <b>Step "+ss.step+" · "+esc(ss.name)+"</b> — "+ss.scrap_pct.toFixed(1)+"% ("+fmt(ss.scrap)+" pcs).","सबसे ज़्यादा स्क्रैप (7 दिन): <b>स्टेप "+ss.step+" · "+esc(ss.name)+"</b> — "+ss.scrap_pct.toFixed(1)+"% ("+fmt(ss.scrap)+" पीस)।")});
 var oldS=0,oldA=0;for(var i=2;i<=NSTEPS;i++){if(st.stepWip[i]>0&&st.stepOld[i]>oldA){oldA=st.stepOld[i];oldS=i}}
 if(oldS&&oldA>=2)out.push({type:"bad",icon:"hourglass-end",text:T("Material waiting <b>"+oldA+" days</b> at Step "+oldS+" ("+esc(stepName(oldS))+") — "+fmt(st.stepWip[oldS])+" pcs. Clear it first.","स्टेप "+oldS+" ("+esc(stepName(oldS))+") पर माल <b>"+oldA+" दिन</b> से रुका — "+fmt(st.stepWip[oldS])+" पीस। पहले इसे निकालें।")});
 var bn=0,bq=0;for(var j=2;j<=NSTEPS;j++){if(st.stepWip[j]>bq){bq=st.stepWip[j];bn=j}}
 if(bn)out.push({type:"warn",icon:"traffic-light",text:T("Bottleneck: <b>Step "+bn+" · "+esc(stepName(bn))+"</b> holds the most WIP ("+fmt(bq)+" pcs).","रुकावट: <b>स्टेप "+bn+" · "+esc(stepName(bn))+"</b> पर सबसे ज़्यादा माल ("+fmt(bq)+" पीस)।")});
 out.push({type:"info",icon:"box",text:T("Final ready stock: <b>"+fmt(st.T.ready)+"</b> pcs · Total stock "+fmt(st.T.total)+".","फाइनल तैयार स्टॉक: <b>"+fmt(st.T.ready)+"</b> पीस · कुल स्टॉक "+fmt(st.T.total)+"।")});
 if(st.T.scP>0)out.push({type:"warn",icon:"recycle",text:T(fmt(st.T.scP)+" pcs scrap pending processing.",fmt(st.T.scP)+" पीस स्क्रैप प्रोसेस होना बाकी।")});
 return out.slice(0,6);
}

/* ---------- tiny markdown renderer (safe: escapes first) ---------- */
function md(src){

 function inl(s){return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<i>$2</i>").replace(/(^|\s)_([^_]+?)_(?=\s|$|[.,!?;:])/g,"$1<i>$2</i>").replace(/`(.+?)`/g,"<code>$1</code>")}
 function close(){if(inUl){html+="</ul>";inUl=false}if(inOl){html+="</ol>";inOl=false}if(tbl.length){html+="<div class='tw'><table>"+tbl.filter(function(r){return !/^\|?\s*:?-{2,}/.test(r)}).map(function(r,i){var c=r.replace(/^\||\|$/g,"").split("|");return "<tr>"+c.map(function(x){return (i?"<td>":"<th>")+inl(x.trim())+(i?"</td>":"</th>")}).join("")+"</tr>"}).join("")+"</table></div>";tbl=[]}}
 lines.forEach(function(l){var m;
  if(/^\s*\|.*\|\s*$/.test(l)){if(inUl||inOl){html+=inUl?"</ul>":"</ol>";inUl=inOl=false}tbl.push(l.trim());return}
  if(tbl.length)close();
  if((m=l.match(/^\s*#{1,4}\s+(.*)/))){close();html+="<h4>"+inl(m[1])+"</h4>";return}
  if((m=l.match(/^\s*[-*•]\s+(.*)/))){if(inOl){html+="</ol>";inOl=false}if(!inUl){html+="<ul>";inUl=true}html+="<li>"+inl(m[1])+"</li>";return}

  close();if(l.trim())html+="<p>"+inl(l)+"</p>";
 });close();return html;
}

function voiceSupported(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition)}
var REC=null,VOICE_CB=null;
function listen(onFinal,onInterim){
 if(!voiceSupported()){toast(T("Voice not supported in this browser — use Chrome","इस ब्राउज़र में वॉइस नहीं — Chrome इस्तेमाल करें"),"warning");return false}
 try{if(REC)REC.abort()}catch(e){}
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;var r=new SR();REC=r;
 r.lang=lang==="hi"?"hi-IN":"en-IN";r.interimResults=true;r.maxAlternatives=1;r.continuous=false;
 var finalTxt="";
 r.onresult=function(ev){var txt="";for(var i=ev.resultIndex;i<ev.results.length;i++){txt+=ev.results[i][0].transcript;if(ev.results[i].isFinal)finalTxt+=ev.results[i][0].transcript}onInterim&&onInterim(finalTxt||txt)};
 r.onerror=function(ev){if(ev.error==="not-allowed")toast(T("Allow microphone permission","माइक्रोफ़ोन की अनुमति दें"),"warning");else if(ev.error!=="aborted"&&ev.error!=="no-speech")toast("Voice: "+ev.error,"warning")};
 r.onend=function(){REC=null;onFinal&&onFinal(finalTxt.trim())};
 try{if(window.speechSynthesis)speechSynthesis.cancel();r.start();vibrate(30);return true}catch(e){toast("Voice: "+e.message,"warning");return false}
}

var NAVW=[["stock",/stock|स्टॉक|स्टोक|inventory|माल/],["mytasks",/task|टास्क|मेरे काम|mere kaam|my work/],["entry",/new batch|naya batch|नया बैच|नया|new entry|batch shuru|बैच शुरू/],["batches",/batches|batch list|बैच लिस्ट|सभी बैच|sab batch|batch/],["scrap",/scrap|स्क्रैप|स्क्रेप/],["reports",/report|रिपोर्ट/],["planning",/target|टारगेट/],["dashboard",/home|dashboard|होम|डैशबोर्ड|मुख्य/],["settings",/setting|सेटिंग/],["users",/users?\b|यूज़र|यूजर/],["ai",/assistant|असिस्टेंट|chat|चैट/]];
var OPENW=/\b(open|show|go to|goto|kholo|khol do|kholiye|dikhao|dikha do|dikhaiye|chalo|jao|le chalo)\b|खोलो|खोल दो|खोलिए|दिखाओ|दिखा दो|दिखाइए|चलो|जाओ|ले चलो/;
var QUESW=/kitna|kitne|kya|kaun|kahan|kab|kyu|how|what|which|where|when|why|\?|कितना|कितने|क्या|कौन|कहाँ|कहां|कब|क्यों/;
function parseNav(q,strict){var s=nz(q);
 if(/dark mode|डार्क/.test(s))return {theme:"dark"};if(/light mode|लाइट/.test(s))return {theme:"light"};
 if(/^(hindi|हिंदी)( me| में)?( karo| करो)?$|switch to hindi/.test(s))return {lang:"hi"};if(/^(english|इंग्लिश)( me| में)?( karo| करो)?$|switch to english/.test(s))return {lang:"en"};
 if(/logout|log out|लॉग आउट|sign out/.test(s))return {logout:1};
 var wantsOpen=OPENW.test(s);if(QUESW.test(s)&&!wantsOpen)return null;if(strict&&!wantsOpen)return null;
 for(var i=0;i<NAVW.length;i++){if(NAVW[i][1].test(s)){var p=NAVW[i][0];if(visNav().some(function(n){return n[0]===p}))return {page:p}}}
 return null;
}
function doNav(n){

function speak(text,force){

 var clean=String(text).replace(/[#*_`|>]/g,"").replace(/https?:\S+/g,"").replace(/\n+/g,". ").replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,"").slice(0,900);

}
